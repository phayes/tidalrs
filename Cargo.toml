[package]
authors = ["Patrick Hayes"]
categories = ["multimedia"]
description = "Tidal (v1) API client"
edition = "2024"
keywords = ["audio", "tidal"]
name = "tidalrs"
version = "0.6.2"
license = "MIT"
repository = "https://github.com/phayes/tidalrs"
documentation = "https://docs.rs/tidalrs"
readme = "README.md"
homepage = "https://github.com/phayes/tidalrs"

[dependencies]
async-recursion = "^1.0"
log = "^0.4"
serde = { version = "^1.0", features = ["derive"] }
serde_json = "^1.0"
strum = { version = "0.28", features = ["derive"] }
strum_macros = "0.28"
thiserror = "^2.0"
tokio = { version = "1.0", features = ["macros", "sync", "time"] }
url = "^2.5"
reqwest = { version = "^0.13", default-features = false, features = ["json", "multipart", "query", "form", "rustls", "stream"] }
arc-swap = "^1.7"
stream-download = { version = "0.24.4", features = ["reqwest-rustls"], optional = true }
base64 = "0.23"
sha2 = "0.11"
rand = "0.10"
playdash = { version = "0.1.1", optional = true }
# The decoders Tidal's DASH streams need: FLAC and AAC in fragmented MP4.
rodio = { version = "0.22", default-features = false, features = ["symphonia-isomp4", "symphonia-flac", "symphonia-aac"], optional = true }

[features]
default = ["playback"]
# Seekable audio streams: MPEG-DASH via playdash and progressive URLs via
# stream-download, leaving decoding and output to the caller.
playback = ["dep:playdash", "dep:stream-download", "tokio/rt"]
# A ready-to-play rodio source, with symphonia decoders for Tidal's codecs.
rodio = ["playback", "playdash/rodio", "dep:rodio"]

[package.metadata.docs.rs]
all-features = true

[[example]]
name = "basic_search"
path = "examples/basic_search.rs"

[[example]]
name = "authentication"
path = "examples/authentication.rs"

[[example]]
name = "pkce_auth"
path = "examples/pkce_auth.rs"

[[example]]
name = "playlist_management"
path = "examples/playlist_management.rs"

[[example]]
name = "audio_streaming"
path = "examples/audio_streaming.rs"
required-features = ["playback"]

[[example]]
name = "audio_streaming_rodio"
path = "examples/audio_streaming_rodio.rs"
required-features = ["rodio"]

[[example]]
name = "favorites_management"
path = "examples/favorites_management.rs"

[[example]]
name = "album_exploration"
path = "examples/album_exploration.rs"

[dev-dependencies]
async-recursion = "^1.0"
env_logger = "0.11"
log = "^0.4"
mockito = "1"
rodio = "0.22"
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
