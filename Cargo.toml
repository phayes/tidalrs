[package]
authors = ["Patrick Hayes"]
categories = ["multimedia"]
description = "Tidal (v1) API client"
edition = "2024"
keywords = ["audio", "tidal"]
name = "tidalrs"
version = "0.6.0"
license = "MIT"
repository = "https://github.com/phayes/tidalrs"
documentation = "https://docs.rs/tidalrs"
readme = "README.md"
homepage = "https://github.com/phayes/tidalrs"

[dependencies]
async-recursion = "^1.0"
log = "^0.4"
serde = { version = "^1.0", features = ["derive"] }
serde_json = "^1.0"
strum = { version = "0.28", features = ["derive"] }
strum_macros = "0.28"
thiserror = "^2.0"
tokio = { version = "1.0", features = ["macros", "sync", "time"] }
url = "^2.5"
reqwest = { version = "^0.13", default-features = false, features = ["json", "multipart", "query", "form", "rustls", "stream"] }
arc-swap = "^1.7"
stream-download = { version = "0.24.4", features = ["reqwest-rustls"] }
base64 = "0.23"
sha2 = "0.11"
rand = "0.10"

[[example]]
name = "baic_search"
path = "examples/basic_search.rs"

[[example]]
name = "authentication"
path = "examples/authentication.rs"

[[example]]
name = "playlist_management"
path = "examples/playlist_management.rs"

[[example]]
name = "audio_streaming"
path = "examples/audio_streaming.rs"

[[example]]
name = "favorites_management"
path = "examples/favorites_management.rs"

[[example]]
name = "album_exploration"
path = "examples/album_exploration.rs"

[dev-dependencies]
async-recursion = "^1.0"
env_logger = "0.11"
log = "^0.4"
mockito = "1"
rodio = "0.22"
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
